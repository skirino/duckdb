name: NightlyTests
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches-ignore:
      - 'main'
      - 'feature'
      - 'v*.*-*'
      - 'gh-readonly-queue/**'
    paths:
      - '.github/workflows/NightlyTests.yml'
      - '.github/patches/duckdb-wasm/**'
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/NightlyTests.yml'
      - '.github/patches/duckdb-wasm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_WASM_VERSION: "cf2048bd6d669ffa05c56d7d453e09e99de8b87e"
  PYTHONUNBUFFERED: 1

jobs:
  check-draft:
    # We run all other jobs on PRs only if they are not draft PR
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Preliminary checks on CI
        run: echo "Event name is ${{ github.event_name }}"

  codeql-analyze:
    name: Analyze (${{ matrix.language }})
    needs: check-draft
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
          - c-cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup proxy for registries
        run: echo "No registry proxy configuration required"

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  linux-memory-leaks:
     name: Linux Memory Leaks
     needs: check-draft
     runs-on: ubuntu-24.04
     steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - uses: actions/setup-python@v6
       with:
         python-version: '3.12'

       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       shell: bash
       run: python3 scripts/ci/retry.py -- make

     - name: Test
       shell: bash
       run: |
         python3 test/memoryleak/test_memory_leaks.py

  release-assert:
    name: Release Assertions
    runs-on: ubuntu-latest
    needs: linux-memory-leaks
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install
      run: python3 scripts/ci/retry.py -- make toolsci

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Build
      shell: bash
      run: python3 scripts/ci/retry.py -- make relassert

    - name: Test
      shell: bash
      run: |
          ./build/relassert/test/run --test-config test/configs/release_assertions.json --batch-timeout 600 "*"

  release-assert-osx-storage:
    name: Release Assertions OSX Storage
    runs-on: macos-latest
    needs: linux-memory-leaks
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'


    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Build
      shell: bash
      run: python3 scripts/ci/retry.py -- bash -lc 'UNSAFE_NUMERIC_CAST=1 make relassert'

    - name: Test
      shell: bash
      run: |
          ./build/relassert/test/run --test-config test/configs/release_assertions.json --batch-timeout 600 "*"

  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    needs: linux-memory-leaks
    env:
      CC: clang-20
      CXX: clang++-20

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install
      timeout-minutes: 10
      shell: bash
      run: |
        python3 scripts/ci/retry.py -- make toolsci
        python3 scripts/ci/retry.py -- sudo apt-get install -y -qq valgrind clang

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Build
      shell: bash
      run: python3 scripts/ci/retry.py -- make relassert

    - name: Output version info
      shell: bash
      run: ./build/relassert/duckdb -c "PRAGMA version;"

    - name: Test
      shell: bash
      run: ./build/relassert/test/run --retry 0 --workers 1 --batch-size 1 --batch-timeout 1200 --test-command "valgrind {binary} {flags} -f {test_list}" test/sql/tpch/tpch_sf001.test_slow

  sqllogic:
     name: Sqllogic tests
     runs-on: ubuntu-latest # Secondary task of this CI job is to test building duckdb on latest ubuntu
     needs: linux-memory-leaks

     steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Install tools
       shell: bash
       run: python3 scripts/ci/retry.py --timeout 2m -- make toolsci

     - name: Test SQLite Compatibility
       shell: bash
       run: bazel test //:sqlite_slow_test //:sqlite_tags_test //:sqlite_tags_slow_test

  storage-initialization:
     name: Storage Initialization Verification
     runs-on: ubuntu-24.04
     needs: linux-memory-leaks
     env:
       CC: gcc
       CXX: g++

     steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - name: Install
       shell: bash
       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       shell: bash
       run: make debug

     - name: Test
       shell: bash
       run: python3 scripts/test_zero_initialize.py

  regression-test-memory-safety:
   name: Regression Tests between safe and unsafe builds
   runs-on: ubuntu-24.04
   needs: linux-memory-leaks
   env:
     CC: gcc
     CXX: g++

   steps:
     - name: Checkout
       uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - name: Checkout tools repo
       uses: actions/checkout@v6
       with:
         fetch-depth: 0
         path: unsafe

     - uses: actions/setup-python@v6
       with:
         python-version: '3.12'

     - name: Install
       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       shell: bash
       run: |
         python3 scripts/ci/retry.py -- make

         cd unsafe
         python3 ../scripts/ci/retry.py -- bash -lc 'UNSAFE_NUMERIC_CAST=1 DISABLE_MEMORY_SAFETY=1 make'

     - name: Set up benchmarks
       shell: bash
       run: |
         cp -r benchmark unsafe/

     - name: Regression Test Micro
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/micro.csv --verbose --threads 2

     - name: Regression Test TPCH
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/tpch.csv --verbose --threads 2

     - name: Regression Test TPCDS
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/tpcds.csv --verbose --threads 2

     - name: Regression Test H2OAI
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/h2oai.csv --verbose --threads 2

     - name: Regression Test IMDB
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/imdb.csv --verbose --threads 2

  bwc-test:
    name: BWC Test (DuckDB ${{ matrix.series.group }})
    runs-on: ubuntu-latest
    needs: bwc-build
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.bwc-build.outputs.groups) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download DuckDB binary
        uses: actions/download-artifact@v8
        with:
          name: duckdb-binary
          path: build/release

      - name: Make DuckDB binary executable
        run: chmod +x build/release/duckdb

      - name: Install Python dependencies
        run: python3 scripts/ci/retry.py -- pip install duckdb git+https://github.com/duckdb/duckdb-sqllogictest-python.git

      - name: Run BWC series
        run: |
          versions='${{ toJson(matrix.series.versions) }}'
          mapfile -t VERSION_LIST < <(python3 -c 'import json,sys; [print(v) for v in json.loads(sys.argv[1])]' "$versions")
          FAILED=0
          FAILED_VERSIONS=""
          RUNTIME_DIR="duckdb_unittest_tempdir/bwc/runtime"
          mkdir -p "${RUNTIME_DIR}"
          mkdir -p duckdb_unittest_tempdir/bwc/cache

          for VERSION in "${VERSION_LIST[@]}"; do
            echo "============================================================"
            echo "Running BWC for ${VERSION} (group: ${{ matrix.series.group }})"
            echo "============================================================"

            if [ "${{ vars.ENABLE_BWC_CACHE_DOWNLOAD }}" = "true" ]; then
              CACHE_ARCHIVE="runtime_${VERSION}.tar.gz"
              DOWNLOAD_URL="https://raw.githubusercontent.com/duckdb/bwc-test-utils/main/cache/${CACHE_ARCHIVE}"
              HTTP_CODE=$(curl -sL -w '%{http_code}' -o "/tmp/${CACHE_ARCHIVE}" "${DOWNLOAD_URL}" || true)
              if [ "${HTTP_CODE}" = "200" ]; then
                tar xzf "/tmp/${CACHE_ARCHIVE}" -C "${RUNTIME_DIR}"
                CACHED=$(find "${RUNTIME_DIR}/${VERSION}" -name "*.plan.bin" | wc -l)
                echo "Extracted cache for ${VERSION}: ${CACHED} cached test plans"
              else
                echo "Failed to download cache for ${VERSION} (HTTP ${HTTP_CODE})"
                FAILED=1
                FAILED_VERSIONS="${FAILED_VERSIONS} ${VERSION}(cache)"
              fi
            fi

            if ! python3.11 test/bwc/runner.py --old_duckdb_version="${VERSION}"; then
              FAILED=1
              FAILED_VERSIONS="${FAILED_VERSIONS} ${VERSION}(tests)"
            fi

            if ! python3.11 test/bwc/export_cache.py --version "${VERSION}" --output-dir duckdb_unittest_tempdir/bwc/cache; then
              FAILED=1
              FAILED_VERSIONS="${FAILED_VERSIONS} ${VERSION}(export)"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "BWC series had failures:${FAILED_VERSIONS}"
            exit 1
          fi

      - name: Upload BWC cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bwc-cache-${{ matrix.series.group }}
          path: duckdb_unittest_tempdir/bwc/cache/runtime_*.tar.gz

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bwc-test-results-${{ matrix.series.group }}
          path: |
            duckdb_unittest_tempdir/bwc/tests_summary_*.txt
            duckdb_unittest_tempdir/bwc/reports/test_report_*.duckdb

  summary:
    name: BWC Test Summary
    runs-on: ubuntu-24.04
    needs: bwc-test
    if: always()
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bwc-test-results-*
          merge-multiple: true

      - name: Aggregate results
        run: |
          echo "============================================================"
          echo "BWC Test Summary"
          echo "============================================================"
          failed=0
          for summary in tests_summary_*.txt; do
            [ -f "$summary" ] || continue
            version="${summary#tests_summary_}"
            version="${version%.txt}"
            failures=$(grep '# FAILED' "$summary" || true)
            if [ -n "$failures" ]; then
              echo ""
              echo "Failed tests for DuckDB version '$version':"
              echo "$failures" | while read -r line; do
                echo "  $line"
              done
              failed=1
            fi
          done
          echo "============================================================"
          if [ "$failed" -eq 1 ]; then
            echo "Some BWC tests failed."
            exit 1
          else
            echo "All BWC tests passed."
          fi
